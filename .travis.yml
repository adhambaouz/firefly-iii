language: php
sudo: false


php:
  - 5.5
  - 5.6

install:
  - composer update
  - php artisan env
  - mv -v .env.testing .env

script:
  - phpunit

after_script:
  - php vendor/bin/coveralls
  - CODECLIMATE_REPO_TOKEN=REDACTED_USE_PRIVATE_CONFIGURATION ./vendor/bin/test-reporter --stdout > codeclimate.json
  - "curl -X POST -d @codeclimate.json -H 'Content-Type: application/json' -H 'User-Agent: Code Climate (PHP Test Reporter v0.1.1)' https://codeclimate.com/test_reports"