language: php
sudo: false


php:
  - 5.5
  - 5.6

addons:
  code_climate:
    repo_token: REDACTED_USE_PRIVATE_CONFIGURATION

install:
  - rm composer.lock
  - composer install
  - php artisan env
  - mv -v .env.testing .env
  - php artisan migrate --seed

script:
  - phpunit --debug

after_script:
  - php vendor/bin/coveralls
